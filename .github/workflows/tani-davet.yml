# #537 tanı (geçici): canlı web davet sayfası yüklemede mi kalıyor? Yalnız bu dala push'ta çalışır; iş bitince dal silinir.
name: tani-davet
on:
  push:
    branches: [tani/davet-537]
permissions:
  contents: read
jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Davet sayfası (uydurma token)
        run: |
          node scripts/tani/davet-web.cjs "https://gezi-web.pages.dev/r/Zz9Zz9Zz"
          node scripts/tani/davet-web.cjs "https://gezi-web.pages.dev/r/g/Zz9Zz9Zz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tani-davet
          path: tani-davet.png
