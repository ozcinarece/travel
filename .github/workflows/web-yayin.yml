name: web-yayin

# #137 KK2: uygulamanın web çıktısı (davet sayfası /r/{token} ve salt-okunur plan) — `main`'e her birleştirmede
# Cloudflare Pages'e dağıtılır (yönetim paneliyle aynı hesap, ayrı proje). Yönetim grubu bu pakete GİRMEZ (YONETIM yok).
# Gerekli secret'lar: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. Değişkenler: APP_DOMAIN (Pages alan adı ya da özel alan,
# ör. tripmate.pages.dev), isteğe bağlı CLOUDFLARE_PAGES_WEB_PROJE (varsayılan gezi-web).
# Universal/App Link doğrulaması için isteğe bağlı: APPLE_TEAM_ID + IOS_BUNDLE_ID (AASA), ANDROID_PACKAGE + ANDROID_SHA256
# (assetlinks.json; secret). Verilmeyen dosya yazılmaz, iş uyarır.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-yayin
  cancel-in-progress: true

jobs:
  yayin:
    runs-on: ubuntu-latest
    environment:
      name: web
      url: https://${{ vars.APP_DOMAIN }}
    # Cloudflare kimlik bilgileri yalnız onlara ihtiyaç duyan adımlarda (npm ci sırasındaki install betikleri okuyamasın).
    env:
      PROJE: ${{ vars.CLOUDFLARE_PAGES_WEB_PROJE || 'gezi-web' }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      # #144: Profil › Yardım ve geri bildirim e-postası (repo değişkeni; boşsa satır gösterilmez).
      EXPO_PUBLIC_DESTEK_EPOSTA: ${{ vars.DESTEK_EPOSTA }}
      EXPO_PUBLIC_SUPABASE_URL: https://xwqeobelyeuzoxyuvauw.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_XB3vg3rrcdIK9Bafkv-Uug_G-5IEyyN
      EXPO_PUBLIC_APPLE_SIGN_IN: '0'
      EXPO_PUBLIC_GOOGLE_MAPS_WEB_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_WEB_KEY }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      ANDROID_PACKAGE: ${{ vars.ANDROID_PACKAGE }}
      ANDROID_SHA256: ${{ secrets.ANDROID_SHA256 }}
    steps:
      - name: Ön koşul
        id: kosul
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID tanımlı değil; web dağıtılmadı."
            echo "hazir=0" >> "$GITHUB_OUTPUT"
          else
            echo "hazir=1" >> "$GITHUB_OUTPUT"
          fi
          [ -z "$APP_DOMAIN" ] && echo "::warning::APP_DOMAIN değişkeni boş; davet linkleri alan adsız üretilir." || true
      - uses: actions/checkout@v4
        if: steps.kosul.outputs.hazir == '1'
      - uses: actions/setup-node@v4
        if: steps.kosul.outputs.hazir == '1'
        with:
          node-version: 22
          cache: npm
      - if: steps.kosul.outputs.hazir == '1'
        run: npm ci
      - name: Web çıktısı
        if: steps.kosul.outputs.hazir == '1'
        run: |
          npx expo export --platform web --output-dir dist
          test -f dist/index.html
          test -f "dist/r/[token].html"
          # Dinamik rotalar: "[x]" sayfaları köşeli parantezsiz kopyalanır, Pages yeniden yazar (istemci rotayı adres çubuğundan çözer).
          node scripts/web-yonlendirmeler.js dist
          # Universal / App Link doğrulama dosyaları (varsa).
          mkdir -p dist/.well-known
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$IOS_BUNDLE_ID" ]; then
            printf '{"applinks":{"apps":[],"details":[{"appID":"%s.%s","paths":["/r/*"]}]}}\n' "$APPLE_TEAM_ID" "$IOS_BUNDLE_ID" > dist/.well-known/apple-app-site-association
            printf '/.well-known/apple-app-site-association\n  Content-Type: application/json\n' > dist/_headers
          else
            echo "::warning::APPLE_TEAM_ID / IOS_BUNDLE_ID yok; apple-app-site-association yazılmadı (iOS universal link doğrulanmaz)."
          fi
          if [ -n "$ANDROID_PACKAGE" ] && [ -n "$ANDROID_SHA256" ]; then
            printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"%s","sha256_cert_fingerprints":["%s"]}}]\n' "$ANDROID_PACKAGE" "$ANDROID_SHA256" > dist/.well-known/assetlinks.json
          else
            echo "::warning::ANDROID_PACKAGE / ANDROID_SHA256 yok; assetlinks.json yazılmadı (Android App Link doğrulanmaz, link tarayıcıda açılır)."
          fi
      - name: Cloudflare Pages
        if: steps.kosul.outputs.hazir == '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create "$PROJE" --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy dist --project-name="$PROJE" --branch=main --commit-dirty=true
          echo "### Web" >> "$GITHUB_STEP_SUMMARY"
          echo "- https://${APP_DOMAIN:-<APP_DOMAIN tanımlı değil>}/r/{token}" >> "$GITHUB_STEP_SUMMARY"
