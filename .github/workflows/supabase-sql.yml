name: supabase-sql

# Tanı amaçlı tek seferlik SQL (postgres rolü). Sonuç iş logunda. Gizli veri yazdırmaktan kaçının.
on:
  workflow_dispatch:
    inputs:
      sql:
        description: Çalıştırılacak SQL
        required: true
        type: string

jobs:
  sorgu:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xwqeobelyeuzoxyuvauw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: SQL
        env:
          SQL: ${{ inputs.sql }}
        run: node scripts/supabase-sql.mjs "$SQL"
