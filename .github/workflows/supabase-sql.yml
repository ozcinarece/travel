name: supabase-sql

# Tanı amaçlı tek seferlik SQL (postgres rolü). Sonuç iş logunda. Gizli veri yazdırmaktan kaçının.
on:
  workflow_dispatch:
    inputs:
      sql:
        description: Çalıştırılacak SQL
        required: true
        type: string

jobs:
  sorgu:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: xwqeobelyeuzoxyuvauw
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: SQL
        env:
          SQL: ${{ inputs.sql }}
        run: node scripts/supabase-sql.mjs "$SQL"
