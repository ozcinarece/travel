name: supabase-migrate

# Migration'ları ve Edge Function'ları Supabase projesine uygular (Yönetim API + Supabase CLI).
# Gerekli secret: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens).
on:
  workflow_dispatch:
    inputs:
      fonksiyonlar:
        description: Edge Function'ları da dağıt
        default: true
        type: boolean

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_PROJECT_REF: xwqeobelyeuzoxyuvauw

jobs:
  uygula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ön koşul
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN secret'ı tanımlı değil"; exit 1; fi
      - name: Migration'ları uygula
        run: node scripts/supabase-migrate.mjs | tee migrate.log
      - name: Edge Function'ları dağıt
        if: inputs.fonksiyonlar
        run: |
          # Tüm fonksiyonlar (supabase/functions/*; _shared atlanır), JWT doğrulaması açık.
          npx --yes supabase@latest functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Özet
        run: |
          echo "### Supabase" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' migrate.log >> "$GITHUB_STEP_SUMMARY"
