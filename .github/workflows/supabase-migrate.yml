name: supabase-migrate

# Migration'ları ve Edge Function'ları Supabase projesine uygular (Yönetim API + Supabase CLI).
# Gerekli secret: SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens).
# #494: `main`'e migration ya da Edge Function getiren her birleştirmede kendiliğinden çalışır. Migration'ı `main`'e
# yalnız CI'da `db:test` geçmiş ve Ürün onaylı bir PR getirebilir. Veri silen migration otomatik gitmez (bekçi);
# Ece onayından sonra elle (workflow_dispatch, yalnız main) çalıştırılır.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
  workflow_dispatch:
    inputs:
      fonksiyonlar:
        description: Edge Function'ları da dağıt
        default: true
        type: boolean

# İki birleşme arka arkaya gelirse çalışmalar sırayla yürür; yarıda kesilen migration olmaz.
concurrency:
  group: supabase-migrate
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: xwqeobelyeuzoxyuvauw

jobs:
  uygula:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ön koşul
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OLAY: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          # KK5: daldan migrate yok; elle çalıştırma da yalnız main'den.
          if [ "$REF" != "refs/heads/main" ]; then echo "::error::supabase-migrate yalnız main'den çalışır ($OLAY, $REF)"; exit 1; fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::SUPABASE_ACCESS_TOKEN secret'ı tanımlı değil"; exit 1; fi
      - name: Fonksiyonlar dağıtılacak mı
        id: kapsam
        env:
          OLAY: ${{ github.event_name }}
          GIRDI: ${{ inputs.fonksiyonlar }}
        run: |
          # Push'ta her zaman dağıt: concurrency ortada bekleyen çalışmayı iptal edebilir, o push'un fonksiyon
          # değişikliği atlanmasın. Push'u zaten `paths` süzüyor.
          if [ "$OLAY" = "push" ]; then
            echo "fonksiyonlar=true" >> "$GITHUB_OUTPUT"
          else
            echo "fonksiyonlar=$GIRDI" >> "$GITHUB_OUTPUT"
          fi
      - name: Migration'ları uygula
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Otomatik (push) çalışmada bekleyen migration'lardan biri veri silebiliyorsa iş durur (§4, ece-karari);
          # Ece onayından sonra elle (workflow_dispatch) çalıştırılır.
          VERI_SILEN_DURDUR: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node scripts/supabase-migrate.mjs | tee migrate.log
      - name: Edge Function'ları dağıt
        if: steps.kapsam.outputs.fonksiyonlar == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Tüm fonksiyonlar (supabase/functions/*; _shared atlanır), JWT doğrulaması açık.
          # --yes: güncel CLI etkileşimsiz çalıştırmada onay istiyor, yoksa hiçbir şey dağıtmadan çıkıyor.
          # Sürüm sabit: token sabitlenmemiş bir pakete görünmesin.
          npx --yes supabase@3.4.0 functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
      - name: Özet
        run: |
          echo "### Supabase" >> "$GITHUB_STEP_SUMMARY"
          sed 's/^/- /' migrate.log >> "$GITHUB_STEP_SUMMARY"
