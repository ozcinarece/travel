name: ci

on:
  pull_request:
  push:
    branches: [main]
  # Çakışmalı açılıp tabanı sonradan değişen PR'da pull_request olayı gelmez; CI elle çalıştırılabilsin.
  workflow_dispatch:

jobs:
  uygulama:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tip kontrolü
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Birim testleri
        run: npm test -- --ci
      - name: Betik testleri (migration bekçisi)
        run: node --test scripts/*.test.mjs

  # #106 KK1: yönetim paneli mobil pakete girmez — android paketinde (yonetim) rotası ya da panel kodu olmamalı.
  mobil-paket:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ornek.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ornek
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Android paketi yönetim kodu içermez
        run: |
          npx expo export --platform android --no-bytecode --output-dir paket
          if grep -l -e '(yonetim)' -e 'components/yonetim' -e 'features/yonetim' -e 'Menüyü aç' paket/_expo/static/js/android/*.js; then
            echo "::error::Yönetim paneli android paketine girdi (#106 KK1)"; exit 1
          fi

  # #550 KK3: web davet (/r/{token}) ve paylaşım (/r/g/{token}) yolları uçtan uca; Supabase taklit (e2e/), gerçek veri yok.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ornek.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ornek
      EXPO_PUBLIC_APPLE_SIGN_IN: '0'
      APP_DOMAIN: 127.0.0.1:4310
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Web çıktısı (uygulama + davet girişi)
        run: npm run web:derle
      - name: Davet girişi boyut bütçesi (≤ 500 KB gzip, #550 KK2)
        run: |
          davet_js=$(grep -o 'src="/_expo/static/js/web/entry-[0-9a-f]*\.js"' dist/r/_token.html | cut -d'"' -f2)
          uygulama_js=$(grep -o 'src="/_expo/static/js/web/entry-[0-9a-f]*\.js"' dist/index.html | cut -d'"' -f2)
          test -n "$davet_js" && test "$davet_js" != "$uygulama_js"
          boyut=$(gzip -9c "dist$davet_js" | wc -c)
          echo "davet girişi: $davet_js · $((boyut / 1024)) KB gzip" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$boyut" -gt 512000 ]; then
            echo "::error::Davet girişi $((boyut / 1024)) KB gzip; bütçe 500 KB (#550 KK2)"; exit 1
          fi
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Uçtan uca
        run: npm run e2e

  veritabani:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Migration + RLS testleri
        run: bash supabase/tests/run.sh
